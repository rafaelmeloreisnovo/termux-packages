# Candidate-only host contract. No NDK install, Docker, APT deployment or merge.
name: HOLD bootstrap source contract (isolated)
on:
  push:
    branches:
      - 'hold/apt-source-gate-20261024'
    paths:
      - '.github/workflows/hold-source-apt-contract-20261025.yml'
      - '.github/workflows/rafcodephi-real-bootstrap.yml'
      - 'scripts/tests/test_rafcodephi_real_bootstrap_workflow_contract.py'
      - 'packages/proot/src-cli-cli.c.patch'
      - 'scripts/tests/test_rafcodephi_proot_patch.py'
permissions:
  contents: read
concurrency:
  group: hold-packages-source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  host-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact producer SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Bind strict first-party verifier to exact SHA
        uses: rafaelmeloreisnovo/actions/rafcode/verify-source@7ae0fca1090fa3b94f7f86c4c3951bb52189e213
        with:
          expected-sha: ${{ github.sha }}
      - name: Test bootstrap source workflow contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/tests/test_rafcodephi_real_bootstrap_workflow_contract.py
          python3 -m py_compile scripts/tests/test_rafcodephi_real_bootstrap_workflow_contract.py
          bash -n scripts/ci/rafcodephi_ndk_preflight.sh scripts/build-rafcodephi-real-bootstrap.sh
      - name: Test upstream proot diagnostic-only patch
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/tests/test_rafcodephi_proot_patch.py
          python3 scripts/tests/test_rafcodephi_proot_patch.py
          echo 'PROOT_PATCH_SCOPE=SOURCE_DIAGNOSTIC_STRINGS_ONLY' >> "$GITHUB_STEP_SUMMARY"
      - name: Checkout pinned verifier source for adversarial regression tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: rafaelmeloreisnovo/actions
          ref: 7ae0fca1090fa3b94f7f86c4c3951bb52189e213
          path: _actions-source-audit
          sparse-checkout: |
            rafcode/verify-source
          persist-credentials: false
      - name: Verify producer exact SHA and execute negative tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _actions-source-audit rev-parse HEAD)" = '7ae0fca1090fa3b94f7f86c4c3951bb52189e213'
          bash -n _actions-source-audit/rafcode/verify-source/verify.sh
          python3 -m py_compile _actions-source-audit/rafcode/verify-source/test_verify.py
          python3 _actions-source-audit/rafcode/verify-source/test_verify.py
          echo 'SCOPE=PINNED_SOURCE_PRODUCER_NEGATIVE_TESTS_ONLY' >> "$GITHUB_STEP_SUMMARY"
      - name: Scope boundary
        run: |
          {
            echo "SOURCE_COMMIT=${GITHUB_SHA}"
            echo "SCOPE=HOST_BOOTSTRAP_CONTRACT_ONLY"
            echo "NDK_BUILD=NOT_RUN"
            echo "APT_DEVICE=NOT_RUN"
            echo "CLAIM_ALLOWED=false"
          } >> "$GITHUB_STEP_SUMMARY"
