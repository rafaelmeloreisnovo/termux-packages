name: RAFAELIA Inline ASM L0
on:
  pull_request:
    paths:
      - 'core/raf_inline_asm_v1.h'
      - 'tests/raf_inline_asm_v1_selftest.c'
      - 'tests/raf_inline_asm_v1_gate.sh'
      - '.github/workflows/raf-inline-asm-l0.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  abi-pure-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact tested commit
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Resolve LLVM cross-ISA disassembler (build-time only)
        shell: bash
        run: |
          set -euo pipefail
          for tool in llvm-objdump llvm-objdump-21 llvm-objdump-20 llvm-objdump-19 llvm-objdump-18 llvm-objdump-17 llvm-objdump-16; do
            if command -v "$tool" >/dev/null 2>&1; then
              echo "LLVM_OBJDUMP=$(command -v "$tool")" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          sudo apt-get update -qq
          sudo apt-get install -y -qq llvm-18
          test -x /usr/bin/llvm-objdump-18
          echo "LLVM_OBJDUMP=/usr/bin/llvm-objdump-18" >> "$GITHUB_ENV"
      - name: Host/negative vector + ARMv7/AArch64 codegen
        shell: bash
        run: sh tests/raf_inline_asm_v1_gate.sh core
