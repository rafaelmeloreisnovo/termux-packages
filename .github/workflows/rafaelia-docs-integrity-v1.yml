name: RAFAELIA Docs Integrity V1 (scoped, nonpromoting)
on:
  pull_request:
    paths:
      - '**/*.md'
      - 'scripts/ci/doc_ref_integrity_gate.py'
      - 'scripts/ci/test_doc_ref_integrity_gate.py'
      - '.github/workflows/rafaelia-docs-integrity-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  link-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact event SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Python isolated tests (no network)
        run: python3 -m unittest discover -s scripts/ci -p 'test_doc_ref_integrity_gate.py' -v
      - name: Current navigation documents (blocking, scoped)
        run: |
          python3 scripts/ci/doc_ref_integrity_gate.py --root . \
            --file README.md \
            --file docs/00-INDEX.md \
            --file docs/RAFAELIA_DOCS_RECONCILIATION_20261025.md \
            --file docs/RAFAELIA_ROOT_CENSUS_20261025.md --file scripts/ci/README.md
      - name: Historical Markdown audit (nonblocking inventory)
        run: python3 scripts/ci/doc_ref_integrity_gate.py --root . --all --audit-only
