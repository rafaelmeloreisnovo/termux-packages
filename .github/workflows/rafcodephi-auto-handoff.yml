name: RAFCODEPHI Producer — termux-packages to app

on:
  push:
    branches: [main]
    # The 210-minute producer is triggered only by its inputs, not every
    # unrelated docs/audit commit. Full manual rebuild remains available.
    paths:
      - '.github/workflows/rafcodephi-auto-handoff.yml'
      - 'scripts/**'
      - 'packages/**'
      - 'core/**'
      - 'configs/**'
      - 'build-package.sh'
      - 'build-all.sh'
      - 'Dockerfile*'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/rafcodephi-auto-handoff.yml'
      - 'scripts/ci/rafcodephi_producer_zipraf.py'
      - 'scripts/ci/rafcodephi_parallel_batches.py'
      - 'scripts/tests/test_rafcodephi_zipraf_pipeline_contract.py'
      - 'scripts/build-rafcodephi-real-bootstrap.sh'
      - 'scripts/apply-rafcodephi-build-properties.py'
      - 'scripts/validate-rafcodephi-build-properties.sh'
      - 'scripts/emit_rafcodephi_package_custody.py'
      - 'scripts/tests/test_rafcodephi_package_custody_contract.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # New commits invalidate pending contract runs. Explicit producer executions
  # are immutable manual proof jobs and must not be auto-cancelled.
  group: rafcodephi-producer-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  contract:
    name: Handoff contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate producer scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/build-rafcodephi-real-bootstrap.sh
          bash -n scripts/validate-rafcodephi-build-properties.sh
          python3 -m py_compile scripts/apply-rafcodephi-build-properties.py scripts/emit_rafcodephi_package_custody.py
          python3 scripts/tests/test_rafcodephi_termux_api_contract.py
          python3 scripts/ci/rafcodephi_failure_triage.py --self-test
          python3 scripts/tests/test_rafcodephi_package_custody_contract.py
          python3 scripts/ci/rafcodephi_producer_zipraf.py --self-test
          python3 scripts/ci/rafcodephi_parallel_batches.py --self-test
          python3 scripts/tests/test_rafcodephi_zipraf_pipeline_contract.py
          test -x scripts/run-docker.sh
          test -f scripts/run-rafcodephi-bootstrap-docker.sh
          test -x scripts/generate-bootstraps.sh

  produce:
    name: Build + attest ARM/ARM64 producer
    outputs:
      artifact_id: ${{ steps.producer_artifact.outputs.artifact-id }}
      artifact_digest: ${{ steps.producer_artifact.outputs.artifact-digest }}
      handoff_receipt_sha256: ${{ steps.producer_receipt.outputs.sha256 }}
    # A 210-minute ARM+ARM64 producer runs only on an explicit invocation.
    # Push and PR continue to run the quick source-contract job.
    if: github.event_name == 'workflow_dispatch'
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    env:
      APP_REPOSITORY: rafaelmeloreisnovo/termux-app-rafacodephi
      ARTIFACT_NAME: rafcodephi-termux-packages-${{ github.sha }}

    steps:
      - name: Checkout exact producer revision
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Bind RAFCODEPHI package identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports
          python3 scripts/apply-rafcodephi-build-properties.py             --properties scripts/properties.sh             --receipt build/reports/rafcodephi-auto-properties.json
          bash scripts/validate-rafcodephi-build-properties.sh
          git rev-parse HEAD > build/reports/rafcodephi-auto-termux-packages.commit

      - name: Build real ARM and ARM64 bootstrap
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports
          chmod +x scripts/run-docker.sh scripts/build-rafcodephi-real-bootstrap.sh
          set +e
          bash scripts/run-rafcodephi-bootstrap-docker.sh \
            ./scripts/build-rafcodephi-real-bootstrap.sh --architectures arm,aarch64 \
            2>&1 | tee build/reports/rafcodephi-auto-bootstrap.log
          status="${PIPESTATUS[0]}"
          set -e
          python3 - "$status" <<'PY' > build/reports/rafcodephi-auto-bootstrap-status.json
          import json, sys
          status = int(sys.argv[1])
          print(json.dumps({
              "schema": "rafcodephi.auto-producer-build/v1",
              "state": "PASS" if status == 0 else "BLOCKED",
              "exit_code": status,
              "claim_allowed": False,
              "device_runtime_proof": "TOKEN_VAZIO",
          }, sort_keys=True))
          PY
          if [[ "$status" -ne 0 ]]; then
            echo "RAFCODEPHI_PRODUCER=BLOCKED exit_code=$status" >&2
            exit "$status"
          fi

      - name: Fingerprint failed producer build (no rebuild)
        if: ${{ failure() }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/rafcodephi_failure_triage.py \
            --log build/reports/rafcodephi-auto-bootstrap.log \
            --out build/reports/rafcodephi-auto-failure-triage.json \
            --markdown build/reports/rafcodephi-auto-failure-triage.md
          cat build/reports/rafcodephi-auto-failure-triage.md >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve failed build log and receipt
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: rafcodephi-producer-failure-${{ github.run_id }}-${{ github.sha }}
          path: |
            build/reports/rafcodephi-auto-bootstrap.log
            build/reports/rafcodephi-auto-bootstrap-status.json
            build/reports/rafcodephi-auto-failure-triage.json
            build/reports/rafcodephi-auto-failure-triage.md
          if-no-files-found: warn
          retention-days: 14

      - name: Gate producer artifacts and emit receipt
        id: producer_receipt
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST=artifacts/rafcodephi-bootstrap/RAFCODEPHI_REAL_BOOTSTRAP_MANIFEST.txt
          ARM=artifacts/rafcodephi-bootstrap/rafcodephi-bootstrap-arm.zip
          ARM64=artifacts/rafcodephi-bootstrap/rafcodephi-bootstrap-aarch64.zip

          test -s "$MANIFEST"
          test -s "$ARM"
          test -s "$ARM64"
          grep -Fx 'schema=rafcodephi.real-bootstrap-sourcebuild/v1' "$MANIFEST"
          grep -Fx 'package_name=com.termux.rafacodephi' "$MANIFEST"
          grep -Fx 'prefix=/data/data/com.termux.rafacodephi/files/usr' "$MANIFEST"
          grep -Fx 'bridge_allowed=false' "$MANIFEST"
          grep -Fx 'legacy_prefix_allowed=false' "$MANIFEST"
          grep -Fx 'claim_allowed_device_runtime=false' "$MANIFEST"
          grep -Fx 'device_runtime_proof=TOKEN_VAZIO' "$MANIFEST"

          sha256sum "$MANIFEST" "$ARM" "$ARM64"             > build/reports/rafcodephi-auto-bootstrap.sha256

          python3 - "$GITHUB_SHA" "$GITHUB_RUN_ID" "$ARTIFACT_NAME" "$MANIFEST" "$ARM" "$ARM64" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          producer_sha, run_id, artifact_name = sys.argv[1:4]
          paths = [Path(p) for p in sys.argv[4:]]

          def sha256(path: Path) -> str:
              h = hashlib.sha256()
              with path.open("rb") as fh:
                  for block in iter(lambda: fh.read(1 << 20), b""):
                      h.update(block)
              return h.hexdigest()

          receipt = {
              "schema": "rafcodephi.termux-packages-producer-handoff/v1",
              "state": "BUILD_EVIDENCE_PASS",
              "producer_repository": "rafaelmeloreisnovo/termux-packages",
              "producer_commit": producer_sha,
              "producer_run_id": int(run_id),
              "artifact_name": artifact_name,
              "package_name": "com.termux.rafacodephi",
              "prefix": "/data/data/com.termux.rafacodephi/files/usr",
              "architectures": ["arm", "aarch64"],
              "claim_allowed": False,
              "physical_android": "TOKEN_VAZIO",
              "sha256": {str(p): sha256(p) for p in paths},
          }
          out = Path("build/reports/rafcodephi-auto-handoff.json")
          out.write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(out)
          PY

          sha256sum build/reports/rafcodephi-auto-handoff.json             > build/reports/rafcodephi-auto-handoff.json.sha256
          echo "sha256=$(sha256sum build/reports/rafcodephi-auto-handoff.json | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Bundle immutable non-APK producer evidence as ZIPRAF
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/rafcodephi_producer_zipraf.py --root . \
            --source-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" \
            --output build/reports/rafcodephi-producer-evidence.zip
          (cd build/reports && sha256sum -c rafcodephi-producer-evidence.zip.sha256)

      - name: Upload consolidated non-APK ZIPRAF (portable)
        uses: actions/upload-artifact@v7
        with:
          name: rafcodephi-producer-zipraf-${{ github.sha }}
          path: |
            build/reports/rafcodephi-producer-evidence.zip
            build/reports/rafcodephi-producer-evidence.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload immutable producer artifact
        id: producer_artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            artifacts/rafcodephi-bootstrap/RAFCODEPHI_REAL_BOOTSTRAP_MANIFEST.txt
            artifacts/rafcodephi-bootstrap/rafcodephi-bootstrap-arm.zip
            artifacts/rafcodephi-bootstrap/rafcodephi-bootstrap-aarch64.zip
            build/reports/rafcodephi-auto-*
          if-no-files-found: error
          retention-days: 30

      - name: Emit GitHub artifact binding receipt
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.producer_artifact.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.producer_artifact.outputs.artifact-digest }}
          ARTIFACT_URL: ${{ steps.producer_artifact.outputs.artifact-url }}
        run: |
          set -euo pipefail
          python3 - "$GITHUB_SHA" "$GITHUB_RUN_ID" "$ARTIFACT_NAME" "$ARTIFACT_ID" "$ARTIFACT_DIGEST" "$ARTIFACT_URL" <<'PY' > build/reports/rafcodephi-auto-artifact-binding.json
          import json, sys
          producer_sha, run_id, name, artifact_id, digest, url = sys.argv[1:]
          if not artifact_id.isdigit():
              raise SystemExit("invalid artifact id")
          if len(digest) != 64 or any(c not in "0123456789abcdef" for c in digest):
              raise SystemExit("invalid artifact digest")
          print(json.dumps({
              "schema": "rafcodephi.github-artifact-binding/v1",
              "producer_commit": producer_sha,
              "producer_run_id": int(run_id),
              "artifact_name": name,
              "artifact_id": int(artifact_id),
              "artifact_digest": digest,
              "artifact_url": url,
              "claim_allowed": False,
          }, indent=2, sort_keys=True))
          PY
          sha256sum build/reports/rafcodephi-auto-artifact-binding.json > build/reports/rafcodephi-auto-artifact-binding.json.sha256

  verify-batch:
    name: Verify producer batch / ${{ matrix.arch }}
    # A 210-minute ARM+ARM64 producer runs only on an explicit invocation.
    # Push and PR continue to run the quick source-contract job.
    if: github.event_name == 'workflow_dispatch'
    needs: [contract, produce]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        arch: [arm, aarch64]
    steps:
      - name: Checkout verifier at exact producer SHA
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Download exact immutable producer artifact
        uses: actions/download-artifact@v8
        with:
          name: rafcodephi-termux-packages-${{ github.sha }}
          path: inbound

      - name: Verify one architecture without rebuilding
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          ARTIFACT_ID: ${{ needs.produce.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.produce.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          python3 scripts/ci/rafcodephi_parallel_batches.py \
            --mode verify --arch "$ARCH" --inbound inbound \
            --source-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" \
            --artifact-id "$ARTIFACT_ID" --artifact-digest "$ARTIFACT_DIGEST" \
            --output "batch-receipts/batch-$ARCH.json"
          cat "batch-receipts/batch-$ARCH.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload immutable per-arch proof
        uses: actions/upload-artifact@v7
        with:
          name: rafcodephi-batch-${{ github.run_id }}-${{ matrix.arch }}
          path: batch-receipts/batch-${{ matrix.arch }}.json
          if-no-files-found: error
          retention-days: 30

  join-batches:
    name: Fan-in / both producer batches must PASS
    # A 210-minute ARM+ARM64 producer runs only on an explicit invocation.
    # Push and PR continue to run the quick source-contract job.
    if: github.event_name == 'workflow_dispatch'
    needs: [contract, produce, verify-batch]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact verifier
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Download ARM and AArch64 batch receipts
        uses: actions/download-artifact@v8
        with:
          pattern: rafcodephi-batch-${{ github.run_id }}-*
          merge-multiple: true
          path: batch-receipts

      - name: Enforce BOTH independent hash-bound batch receipts
        shell: bash
        env:
          ARTIFACT_ID: ${{ needs.produce.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.produce.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          python3 scripts/ci/rafcodephi_parallel_batches.py \
            --mode join --receipts batch-receipts \
            --source-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" \
            --artifact-id "$ARTIFACT_ID" --artifact-digest "$ARTIFACT_DIGEST" \
            --output batch-receipts/batch-join.json
          (cd batch-receipts && sha256sum batch-*.json > SHA256SUMS.txt)
          (cd batch-receipts && sha256sum -c SHA256SUMS.txt)
          cat batch-receipts/batch-join.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload fan-in receipt, independent of APK
        uses: actions/upload-artifact@v7
        with:
          name: rafcodephi-batch-join-${{ github.run_id }}
          path: batch-receipts/
          if-no-files-found: error
          retention-days: 30

  handoff:
    name: Dispatch only after both ABI receipts + custody PASS
    # A 210-minute ARM+ARM64 producer runs only on an explicit invocation.
    # Push and PR continue to run the quick source-contract job.
    if: github.event_name == 'workflow_dispatch'
    needs: [contract, produce, join-batches]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      APP_REPOSITORY: rafaelmeloreisnovo/termux-app-rafacodephi
      ARTIFACT_NAME: rafcodephi-termux-packages-${{ github.sha }}
      PRODUCER_ARTIFACT_ID: ${{ needs.produce.outputs.artifact_id }}
      PRODUCER_ARTIFACT_DIGEST: ${{ needs.produce.outputs.artifact_digest }}
      HANDOFF_RECEIPT_SHA256: ${{ needs.produce.outputs.handoff_receipt_sha256 }}
    steps:
      - name: Dispatch exact producer evidence to app
        shell: bash
        env:
          CROSS_REPO_TOKEN: ${{ secrets.GITPAT || secrets.PATGITHUB || secrets.GIT }}
        run: |
          set -euo pipefail
          [[ -n "${CROSS_REPO_TOKEN:-}" ]] || {
            echo 'TOKEN_VAZIO: PATGITHUB required for cross-repository dispatch' >&2
            exit 1
          }
          [[ "$PRODUCER_ARTIFACT_ID" =~ ^[0-9]+$ ]] || {
            echo 'BLOCKED: producer artifact id unavailable' >&2
            exit 2
          }
          [[ "$PRODUCER_ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]] || {
            echo 'BLOCKED: producer artifact digest mismatch' >&2
            exit 2
          }
          [[ "$HANDOFF_RECEIPT_SHA256" =~ ^[0-9a-f]{64}$ ]] || {
            echo 'BLOCKED: producer handoff receipt digest mismatch' >&2
            exit 2
          }

          python3 - "$GITHUB_SHA" "$GITHUB_RUN_ID" "$ARTIFACT_NAME" "$HANDOFF_RECEIPT_SHA256" "$PRODUCER_ARTIFACT_ID" "$PRODUCER_ARTIFACT_DIGEST" <<'PY' > /tmp/dispatch.json
          import json
          import sys
          producer_sha, run_id, artifact_name, receipt_sha256, artifact_id, artifact_digest = sys.argv[1:]
          print(json.dumps({
              "event_type": "rafcodephi_packages_ready",
              "client_payload": {
                  "termux_packages_sha": producer_sha,
                  "producer_run_id": int(run_id),
                  "artifact_name": artifact_name,
                  "receipt_sha256": receipt_sha256,
                  "artifact_id": int(artifact_id),
                  "artifact_digest": artifact_digest,
              },
          }))
          PY
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $CROSS_REPO_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$APP_REPOSITORY/dispatches" \
            --data-binary @/tmp/dispatch.json

          echo "RAFCODEPHI_HANDOFF=DISPATCHED producer_sha=$GITHUB_SHA producer_run_id=$GITHUB_RUN_ID artifact=$ARTIFACT_NAME"
