name: rafcodephi-prefix-source-contract

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'core/build_exec.c'
      - 'core/build_exec.h'
      - 'core/source_download.c'
      - 'core/source_download.h'
      - 'core/termux-build-core.c'
      - 'core/Makefile'
      - 'core/tests/test_rafcodephi_prefix_contract.py'
      - 'core/tests/test_source_phase_integration.py'
      - 'core/tests/test_source_acquisition_runtime.c'
      - '.github/workflows/rafcodephi-prefix-source-contract.yml'
  push:
    branches: [ main ]
    paths:
      - 'core/build_exec.c'
      - 'core/build_exec.h'
      - 'core/source_download.c'
      - 'core/source_download.h'
      - 'core/termux-build-core.c'
      - 'core/Makefile'
      - 'core/tests/test_rafcodephi_prefix_contract.py'
      - 'core/tests/test_source_phase_integration.py'
      - 'core/tests/test_source_acquisition_runtime.c'
      - '.github/workflows/rafcodephi-prefix-source-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rafcodephi-prefix-source-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Record toolchain
        run: |
          set -eu
          cc --version | head -n 1
          make --version | head -n 1
          python3 --version
          curl --version | head -n 1
          tar --version | head -n 1

      - name: Verify RAFCODEPhi runtime-prefix and source-phase contracts
        working-directory: core
        run: |
          set -eux
          python3 tests/test_rafcodephi_prefix_contract.py
          python3 tests/test_source_phase_integration.py

      - name: Exercise source acquisition locally
        working-directory: core
        run: |
          set -eux
          cc -Wall -Wextra -Wshadow -Werror -g -O0 -I. \
            tests/test_source_acquisition_runtime.c source_download.c \
            -o test-source-acquisition-runtime
          ./test-source-acquisition-runtime

      - name: Compile clean build core
        working-directory: core
        run: |
          set -eux
          make clean
          make all
          test -x termux-build-core

      - name: Emit fail-closed receipt
        run: |
          printf '%s\n' \
            'RAFCODEPHI_PREFIX_SOURCE_CONTRACT=PASS' \
            'SOURCE_PHASE_INTEGRATION_CONTRACT=PASS' \
            'SOURCE_ACQUISITION_LOCAL_RUNTIME=PASS' \
            'SOURCE_ACQUISITION_REMOTE_NETWORK=NOT_MEASURED' \
            'TARGET_PREFIX=/data/data/com.termux.rafacodephi/files/usr' \
            'STAGING_MODEL=DESTDIR' \
            'PACKAGE_REBUILD_RUNTIME=NOT_MEASURED' \
            'ARM32_ARTIFACT=TOKEN_VAZIO' \
            'ARM64_ARTIFACT=TOKEN_VAZIO' \
            'CLAIM_ALLOWED=false' \
            'RELEASE_ALLOWED=false' \
            "COMMIT=${GITHUB_SHA}"
