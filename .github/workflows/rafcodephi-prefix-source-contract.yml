name: rafcodephi-prefix-source-contract

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'core/build_exec.c'
      - 'core/build_exec.h'
      - 'core/tests/test_rafcodephi_prefix_contract.py'
      - '.github/workflows/rafcodephi-prefix-source-contract.yml'
  push:
    branches: [ main ]
    paths:
      - 'core/build_exec.c'
      - 'core/build_exec.h'
      - 'core/tests/test_rafcodephi_prefix_contract.py'
      - '.github/workflows/rafcodephi-prefix-source-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rafcodephi-prefix-source-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Record toolchain
        run: |
          set -eu
          cc --version | head -n 1
          make --version | head -n 1
          python3 --version

      - name: Verify RAFCODEPhi runtime-prefix source contract
        working-directory: core
        run: |
          set -eux
          python3 tests/test_rafcodephi_prefix_contract.py

      - name: Compile clean build core
        working-directory: core
        run: |
          set -eux
          make clean
          make all
          test -x termux-build-core

      - name: Emit fail-closed receipt
        run: |
          printf '%s\n' \
            'RAFCODEPHI_PREFIX_SOURCE_CONTRACT=PASS' \
            'TARGET_PREFIX=/data/data/com.termux.rafacodephi/files/usr' \
            'STAGING_MODEL=DESTDIR' \
            'PACKAGE_REBUILD_RUNTIME=NOT_MEASURED' \
            'ARM32_ARTIFACT=TOKEN_VAZIO' \
            'ARM64_ARTIFACT=TOKEN_VAZIO' \
            'CLAIM_ALLOWED=false' \
            'RELEASE_ALLOWED=false' \
            "COMMIT=${GITHUB_SHA}"
