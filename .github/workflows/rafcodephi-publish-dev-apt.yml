name: RAFCODEPHI Publish Development APT Repository

on:
  workflow_dispatch:
  pull_request:
    paths: ['packages/**', 'scripts/build-rafcodephi-*.sh', 'scripts/tests/test_rafcodephi_publish_dev_apt_workflow_contract.py', '.github/workflows/rafcodephi-publish-dev-apt.yml']
  push:
    branches:
      - main
      - fix/rafcodephi-live-apt-repository-20260814
    paths: ['packages/**', 'scripts/build-rafcodephi-*.sh', 'scripts/tests/test_rafcodephi_publish_dev_apt_workflow_contract.py', '.github/workflows/rafcodephi-publish-dev-apt.yml']

permissions:
  contents: write

concurrency:
  group: rafcodephi-dev-apt-${{ github.ref }}
  cancel-in-progress: false

jobs:
  arm32-repository:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      CI: 'true'
      TERMUX_DOCKER_USE_SUDO: '1'
      RAFCODEPHI_APT_REPOSITORY_URL: ${{ github.ref_name == 'main' && 'https://raw.githubusercontent.com/rafaelmeloreisnovo/termux-packages/rafcodephi-apt/repo' || 'https://raw.githubusercontent.com/rafaelmeloreisnovo/termux-packages/rafcodephi-apt-preview/repo' }}
      RAFCODEPHI_APT_PUBLISH_BRANCH: ${{ github.ref_name == 'main' && 'rafcodephi-apt' || 'rafcodephi-apt-preview' }}
      RAFCODEPHI_APT_TRUST_MODE: development-trusted
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Validate development APT workflow contract
        shell: bash
        run: python3 scripts/tests/test_rafcodephi_publish_dev_apt_workflow_contract.py

      - name: Materialize RAFCODEPHI package/prefix contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports
          python3 scripts/apply-rafcodephi-build-properties.py \
            --properties scripts/properties.sh \
            --receipt build/reports/rafcodephi-dev-apt-properties.json
          bash scripts/validate-rafcodephi-build-properties.sh
          grep -Fx 'TERMUX_APP__PACKAGE_NAME="com.termux.rafacodephi"' scripts/properties.sh

      - name: Build ARM32 custom-prefix package closure + live bootstrap
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports
          set +e
          (
            test -x scripts/run-docker.sh || {
              echo "RAFCODEPHI_LIVE_APT_BUILD=BLOCKED reason=DOCKER_RUNNER_MISSING" >&2
              exit 126
            }
            exec ./scripts/run-docker.sh env \
              RAFCODEPHI_APT_REPOSITORY_URL="$RAFCODEPHI_APT_REPOSITORY_URL" \
              RAFCODEPHI_APT_TRUST_MODE="$RAFCODEPHI_APT_TRUST_MODE" \
              bash ./scripts/build-rafcodephi-live-bootstrap.sh --architectures arm
          ) 2>&1 | tee build/reports/rafcodephi-live-bootstrap.log
          build_status="${PIPESTATUS[0]}"
          set -e
          python3 - "$build_status" > build/reports/rafcodephi-live-bootstrap-status.json <<'PY'
          import json
          import sys

          status = int(sys.argv[1])
          print(json.dumps({
              "schema": "rafcodephi.live-bootstrap-build-status/v1",
              "state": "PASS" if status == 0 else "BLOCKED",
              "exit_code": status,
              "claim_allowed_release": False,
              "device_runtime_proof": "TOKEN_VAZIO",
          }, sort_keys=True))
          PY
          if [[ "$build_status" -ne 0 ]]; then
            echo "RAFCODEPHI_LIVE_APT_BUILD=BLOCKED exit_code=$build_status; inspect uploaded source-build evidence" >&2
            exit "$build_status"
          fi
          test -s artifacts/rafcodephi-bootstrap/rafcodephi-bootstrap-arm.zip
          test -n "$(find output -maxdepth 1 -type f -name '*.deb' -print -quit)"
          unzip -p artifacts/rafcodephi-bootstrap/rafcodephi-bootstrap-arm.zip etc/apt/sources.list.d/termux.sources > /tmp/termux.sources
          grep -Fx 'Enabled: yes' /tmp/termux.sources
          grep -Fx "URIs: $RAFCODEPHI_APT_REPOSITORY_URL" /tmp/termux.sources
          unzip -p artifacts/rafcodephi-bootstrap/rafcodephi-bootstrap-arm.zip BOOTSTRAP_PROFILE.json | grep -F '"package_repo_runtime_state":"DEVELOPMENT_REPOSITORY_CONFIGURED"'

      - name: Bundle portable source-build evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports
          bundle=build/reports/rafcodephi-arm32-source-built-debs.tar
          state=build/reports/rafcodephi-arm32-source-built-debs.state
          rm -f "$bundle" "$bundle.sha256"
          if [[ -d output ]] && compgen -G 'output/*.deb' >/dev/null; then
            tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner \
              -cf "$bundle" -C output .
            sha256sum "$bundle" > "$bundle.sha256"
            printf '%s\n' \
              'schema=rafcodephi.portable-source-build-evidence/v1' \
              'state=PASS' \
              "archive=$bundle" \
              'claim_allowed_release=false' \
              'device_runtime_proof=TOKEN_VAZIO' > "$state"
          else
            printf '%s\n' \
              'schema=rafcodephi.portable-source-build-evidence/v1' \
              'state=TOKEN_VAZIO' \
              'reason=NO_DEB_OUTPUT' \
              'claim_allowed_release=false' \
              'device_runtime_proof=TOKEN_VAZIO' > "$state"
          fi
      - name: Upload source-build evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rafcodephi-arm32-source-build-evidence-${{ github.sha }}
          if-no-files-found: warn
          path: |
            build/reports/rafcodephi-live-bootstrap.log
            build/reports/rafcodephi-live-bootstrap-status.json
            build/reports/rafcodephi-arm32-source-built-debs.tar
            build/reports/rafcodephi-arm32-source-built-debs.tar.sha256
            build/reports/rafcodephi-arm32-source-built-debs.state
            artifacts/rafcodephi-bootstrap/rafcodephi-bootstrap-arm.zip
            artifacts/rafcodephi-bootstrap/RAFCODEPHI_REAL_BOOTSTRAP_MANIFEST.txt

      - name: Materialize flat APT repository
        shell: bash
        run: |
          set -euo pipefail
          command -v dpkg-scanpackages >/dev/null || { sudo apt-get update; sudo apt-get install -y dpkg-dev; }
          command -v apt-ftparchive >/dev/null || { sudo apt-get update; sudo apt-get install -y apt-utils; }
          rm -rf /tmp/rafcodephi-apt-publish
          mkdir -p /tmp/rafcodephi-apt-publish/repo
          cp output/*.deb /tmp/rafcodephi-apt-publish/repo/
          cd /tmp/rafcodephi-apt-publish/repo
          LC_ALL=C dpkg-scanpackages . /dev/null > Packages
          gzip -9n -c Packages > Packages.gz
          LC_ALL=C apt-ftparchive release . > Release
          sha256sum ./*.deb Packages Packages.gz Release | LC_ALL=C sort -k2 > SHA256SUMS
          printf '%s\n' \
            'schema=rafcodephi.dev-apt-repository/v1' \
            'package_name=com.termux.rafacodephi' \
            'prefix=/data/data/com.termux.rafacodephi/files/usr' \
            'architecture=arm' \
            "source_commit=${GITHUB_SHA}" \
            "publish_branch=${RAFCODEPHI_APT_PUBLISH_BRANCH}" \
            "repository_url=${RAFCODEPHI_APT_REPOSITORY_URL}" \
            'trust=GITHUB_HTTPS_TRANSPORT_ONLY' \
            'production_signing_root=TOKEN_VAZIO' \
            'claim_allowed_release=false' > RAFCODEPHI_REPOSITORY_MANIFEST.txt
          grep -q '^Package: ' Packages
          grep -q '^Architecture: arm$' Packages
          sha256sum -c SHA256SUMS

      - name: Resolve development repository through isolated APT
        shell: bash
        run: |
          set -euo pipefail
          repo=/tmp/rafcodephi-apt-publish/repo
          apt_root=/tmp/rafcodephi-apt-client
          mkdir -p build/reports "$apt_root/etc/apt" "$apt_root/lists/partial" \
            "$apt_root/cache/archives/partial" "$apt_root/var/lib/dpkg"
          : > "$apt_root/var/lib/dpkg/status"
          package_name="$(awk -F ': ' '$1 == "Package" { print $2; exit }' "$repo/Packages")"
          test -n "$package_name"
          printf 'deb [trusted=yes] file:%s ./\n' "$repo" > "$apt_root/etc/apt/sources.list"
          apt_options=(
            -o "Dir=$apt_root"
            -o 'Dir::Etc::sourcelist=etc/apt/sources.list'
            -o 'Dir::Etc::sourceparts=-'
            -o 'Dir::State::status=var/lib/dpkg/status'
            -o 'Dir::State::lists=lists'
            -o 'Dir::Cache::archives=cache/archives'
            -o 'APT::Architecture=arm'
            -o 'APT::Architectures=arm'
            -o 'Acquire::Languages=none'
          )
          set +e
          (
            apt-get "${apt_options[@]}" update
            apt-cache "${apt_options[@]}" show "$package_name"
            apt-get "${apt_options[@]}" -y --download-only --no-install-recommends install "$package_name"
            find "$apt_root/cache/archives" -maxdepth 1 -type f -name '*.deb' -print -quit | grep -q .
          ) 2>&1 | tee build/reports/rafcodephi-isolated-apt.log
          apt_status="${PIPESTATUS[0]}"
          set -e
          python3 - "$apt_status" "$package_name" > build/reports/rafcodephi-isolated-apt-status.json <<'PY'
          import json
          import sys

          status = int(sys.argv[1])
          print(json.dumps({
              "schema": "rafcodephi.isolated-apt-resolution/v1",
              "state": "PASS" if status == 0 else "BLOCKED",
              "exit_code": status,
              "package": sys.argv[2],
              "architecture": "arm",
              "claim_allowed_release": False,
              "device_runtime_proof": "TOKEN_VAZIO",
          }, sort_keys=True))
          PY
          if [[ "$apt_status" -ne 0 ]]; then
            echo "RAFCODEPHI_ISOLATED_APT=BLOCKED exit_code=$apt_status" >&2
            exit "$apt_status"
          fi
          echo "RAFCODEPHI_ISOLATED_APT=PASS package=$package_name architecture=arm"

      - name: Bundle portable APT repository evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports
          repo=/tmp/rafcodephi-apt-publish/repo
          bundle=build/reports/rafcodephi-arm32-dev-apt-repository.tar
          state=build/reports/rafcodephi-arm32-dev-apt-repository.state
          rm -f "$bundle" "$bundle.sha256"
          if [[ -d "$repo" ]] && compgen -G "$repo/*.deb" >/dev/null; then
            tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner \
              -cf "$bundle" -C "$(dirname "$repo")" "$(basename "$repo")"
            sha256sum "$bundle" > "$bundle.sha256"
            printf '%s\n' \
              'schema=rafcodephi.portable-apt-repository-evidence/v1' \
              'state=PASS' \
              "archive=$bundle" \
              'claim_allowed_release=false' \
              'device_runtime_proof=TOKEN_VAZIO' > "$state"
          else
            printf '%s\n' \
              'schema=rafcodephi.portable-apt-repository-evidence/v1' \
              'state=TOKEN_VAZIO' \
              'reason=APT_REPOSITORY_NOT_MATERIALIZED' \
              'claim_allowed_release=false' \
              'device_runtime_proof=TOKEN_VAZIO' > "$state"
          fi
      - name: Upload bootstrap + repository evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rafcodephi-arm32-dev-apt-${{ github.sha }}
          if-no-files-found: warn
          path: |
            build/reports/rafcodephi-arm32-dev-apt-repository.tar
            build/reports/rafcodephi-arm32-dev-apt-repository.tar.sha256
            build/reports/rafcodephi-arm32-dev-apt-repository.state
            build/reports/rafcodephi-isolated-apt.log
            build/reports/rafcodephi-isolated-apt-status.json
            artifacts/rafcodephi-bootstrap/rafcodephi-bootstrap-arm.zip
            artifacts/rafcodephi-bootstrap/RAFCODEPHI_REAL_BOOTSTRAP_MANIFEST.txt

      - name: Publish development repository branch
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'RAFCODEPHI CI'
          git config user.email 'actions@users.noreply.github.com'
          git switch --orphan rafcodephi-apt-publication
          git rm -rf .
          mkdir repo
          cp -a /tmp/rafcodephi-apt-publish/repo/. repo/
          printf '%s\n' '# RAFCODEPHI development APT repository' '' \
            'Custom-prefix ARM32 packages for com.termux.rafacodephi.' '' \
            "Transport branch: ${RAFCODEPHI_APT_PUBLISH_BRANCH}" \
            'Development transport only; production signing root remains TOKEN_VAZIO.' > README.md
          git add README.md repo
          git commit -m "repo: publish RAFCODEPHI ARM32 dev packages from ${GITHUB_SHA}"
          git push --force origin "HEAD:${RAFCODEPHI_APT_PUBLISH_BRANCH}"
