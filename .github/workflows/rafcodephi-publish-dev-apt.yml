name: RAFCODEPHI Publish Development APT Repository

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the signed repository after all gates pass'
        required: true
        default: false
        type: boolean
  pull_request:
    paths: ['packages/**', 'scripts/build-rafcodephi-*.sh', 'scripts/tests/test_rafcodephi_publish_dev_apt_workflow_contract.py', '.github/workflows/rafcodephi-publish-dev-apt.yml']
  push:
    branches:
      - main
      - fix/rafcodephi-live-apt-repository-20260814
    paths: ['packages/**', 'scripts/build-rafcodephi-*.sh', 'scripts/tests/test_rafcodephi_publish_dev_apt_workflow_contract.py', '.github/workflows/rafcodephi-publish-dev-apt.yml']

permissions:
  contents: read

concurrency:
  group: rafcodephi-dev-apt-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  arm32-repository:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      CI: 'true'
      TERMUX_DOCKER_USE_SUDO: '1'
      RAFCODEPHI_APT_REPOSITORY_URL: ${{ github.ref_name == 'main' && 'https://raw.githubusercontent.com/rafaelmeloreisnovo/termux-packages/rafcodephi-apt/repo' || 'https://raw.githubusercontent.com/rafaelmeloreisnovo/termux-packages/rafcodephi-apt-preview/repo' }}
      RAFCODEPHI_APT_PUBLISH_BRANCH: ${{ github.ref_name == 'main' && 'rafcodephi-apt' || 'rafcodephi-apt-preview' }}
      RAFCODEPHI_APT_TRUST_MODE: signed-by
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate development APT workflow contract
        shell: bash
        run: python3 scripts/tests/test_rafcodephi_publish_dev_apt_workflow_contract.py

      - name: Prepare APT signing identity
        shell: bash
        env:
          PROD_KEY_B64: ${{ secrets.RAFCODEPHI_APT_SIGNING_KEY_B64 }}
          PROD_FINGERPRINT: ${{ secrets.RAFCODEPHI_APT_SIGNING_FINGERPRINT }}
        run: |
          set -euo pipefail
          mkdir -p build/signing
          export GNUPGHOME="$RUNNER_TEMP/rafcodephi-apt-gnupg"
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"

          publish_requested=false
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "${{ inputs.publish }}" == "true" ]]; then
            publish_requested=true
          fi

          if [[ "$publish_requested" == true ]]; then
            [[ -n "${PROD_KEY_B64:-}" && -n "${PROD_FINGERPRINT:-}" ]] || {
              echo "TOKEN_VAZIO: production APT signing key/fingerprint not bound" >&2
              exit 2
            }
            printf '%s' "$PROD_KEY_B64" | base64 -d > "$RUNNER_TEMP/rafcodephi-apt-private.key"
            gpg --batch --import "$RUNNER_TEMP/rafcodephi-apt-private.key" >/dev/null 2>&1
            rm -f "$RUNNER_TEMP/rafcodephi-apt-private.key"
            FPR="$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1=="fpr"{print $10; exit}')"
            [[ "$FPR" == "$PROD_FINGERPRINT" ]] || {
              echo "BLOCKED: production APT signing fingerprint mismatch" >&2
              exit 2
            }
            MODE=production
          else
            gpg --batch --passphrase '' --quick-generate-key \
              "RAFCODEPHI CI Ephemeral APT <ci@rafcodephi.invalid>" ed25519 sign 1d >/dev/null 2>&1
            FPR="$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1=="fpr"{print $10; exit}')"
            MODE=ephemeral-test
          fi

          [[ "$FPR" =~ ^[0-9A-F]{40}$ ]] || { echo "BLOCKED invalid APT signing fingerprint" >&2; exit 2; }
          gpg --batch --export "$FPR" > build/signing/rafcodephi-archive-key.gpg
          gpg --batch --armor --export "$FPR" > build/signing/rafcodephi-archive-key.asc
          test -s build/signing/rafcodephi-archive-key.gpg
          test -s build/signing/rafcodephi-archive-key.asc

          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          echo "RAFCODEPHI_APT_SIGNING_FINGERPRINT=$FPR" >> "$GITHUB_ENV"
          echo "RAFCODEPHI_APT_SIGNING_MODE=$MODE" >> "$GITHUB_ENV"

      - name: Materialize RAFCODEPHI package/prefix contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports
          python3 scripts/apply-rafcodephi-build-properties.py \
            --properties scripts/properties.sh \
            --receipt build/reports/rafcodephi-dev-apt-properties.json
          bash scripts/validate-rafcodephi-build-properties.sh
          grep -Fx 'TERMUX_APP__PACKAGE_NAME="com.termux.rafacodephi"' scripts/properties.sh

      - name: Build ARM32 custom-prefix package closure + live bootstrap
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports
          set +e
          (
            test -x scripts/run-docker.sh || {
              echo "RAFCODEPHI_LIVE_APT_BUILD=BLOCKED reason=DOCKER_RUNNER_MISSING" >&2
              exit 126
            }
            exec ./scripts/run-docker.sh env \
              RAFCODEPHI_APT_REPOSITORY_URL="$RAFCODEPHI_APT_REPOSITORY_URL" \
              RAFCODEPHI_APT_TRUST_MODE="$RAFCODEPHI_APT_TRUST_MODE" \
              RAFCODEPHI_APT_PUBLIC_KEY_FILE=/home/builder/termux-packages/build/signing/rafcodephi-archive-key.gpg \
              bash ./scripts/build-rafcodephi-live-bootstrap.sh --architectures arm
          ) 2>&1 | tee build/reports/rafcodephi-live-bootstrap.log
          build_status="${PIPESTATUS[0]}"
          set -e
          python3 - "$build_status" > build/reports/rafcodephi-live-bootstrap-status.json <<'PY'
          import json
          import sys

          status = int(sys.argv[1])
          print(json.dumps({
              "schema": "rafcodephi.live-bootstrap-build-status/v1",
              "state": "PASS" if status == 0 else "BLOCKED",
              "exit_code": status,
              "claim_allowed_release": False,
              "device_runtime_proof": "TOKEN_VAZIO",
          }, sort_keys=True))
          PY
          if [[ "$build_status" -ne 0 ]]; then
            echo "RAFCODEPHI_LIVE_APT_BUILD=BLOCKED exit_code=$build_status; inspect uploaded source-build evidence" >&2
            exit "$build_status"
          fi
          test -s artifacts/rafcodephi-bootstrap/rafcodephi-bootstrap-arm.zip
          test -n "$(find output -maxdepth 1 -type f -name '*.deb' -print -quit)"
          unzip -p artifacts/rafcodephi-bootstrap/rafcodephi-bootstrap-arm.zip etc/apt/sources.list.d/termux.sources > /tmp/termux.sources
          grep -Fx 'Enabled: yes' /tmp/termux.sources
          grep -Fx "URIs: $RAFCODEPHI_APT_REPOSITORY_URL" /tmp/termux.sources
          grep -Fq 'Signed-By: /data/data/com.termux.rafacodephi/files/usr/etc/apt/keyrings/rafcodephi-archive-key.gpg' /tmp/termux.sources
          ! grep -Fq 'Trusted: yes' /tmp/termux.sources
          unzip -p artifacts/rafcodephi-bootstrap/rafcodephi-bootstrap-arm.zip BOOTSTRAP_PROFILE.json | grep -F '"package_repo_runtime_state":"DEVELOPMENT_REPOSITORY_CONFIGURED"'

      - name: Bundle portable source-build evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports
          bundle=build/reports/rafcodephi-arm32-source-built-debs.tar
          state=build/reports/rafcodephi-arm32-source-built-debs.state
          rm -f "$bundle" "$bundle.sha256"
          if [[ -d output ]] && compgen -G 'output/*.deb' >/dev/null; then
            tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner \
              -cf "$bundle" -C output .
            sha256sum "$bundle" > "$bundle.sha256"
            printf '%s\n' \
              'schema=rafcodephi.portable-source-build-evidence/v1' \
              'state=PASS' \
              "archive=$bundle" \
              'claim_allowed_release=false' \
              'device_runtime_proof=TOKEN_VAZIO' > "$state"
          else
            printf '%s\n' \
              'schema=rafcodephi.portable-source-build-evidence/v1' \
              'state=TOKEN_VAZIO' \
              'reason=NO_DEB_OUTPUT' \
              'claim_allowed_release=false' \
              'device_runtime_proof=TOKEN_VAZIO' > "$state"
          fi
      - name: Upload source-build evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rafcodephi-arm32-source-build-evidence-${{ github.sha }}
          if-no-files-found: warn
          path: |
            build/reports/rafcodephi-live-bootstrap.log
            build/reports/rafcodephi-live-bootstrap-status.json
            build/reports/rafcodephi-arm32-source-built-debs.tar
            build/reports/rafcodephi-arm32-source-built-debs.tar.sha256
            build/reports/rafcodephi-arm32-source-built-debs.state
            artifacts/rafcodephi-bootstrap/rafcodephi-bootstrap-arm.zip
            artifacts/rafcodephi-bootstrap/RAFCODEPHI_REAL_BOOTSTRAP_MANIFEST.txt

      - name: Materialize flat signed APT repository
        shell: bash
        run: |
          set -euo pipefail
          command -v dpkg-scanpackages >/dev/null || { sudo apt-get update; sudo apt-get install -y dpkg-dev; }
          command -v apt-ftparchive >/dev/null || { sudo apt-get update; sudo apt-get install -y apt-utils; }
          command -v gpg >/dev/null || { sudo apt-get update; sudo apt-get install -y gnupg; }

          rm -rf /tmp/rafcodephi-apt-publish
          mkdir -p /tmp/rafcodephi-apt-publish/repo
          cp output/*.deb /tmp/rafcodephi-apt-publish/repo/
          cd /tmp/rafcodephi-apt-publish/repo

          LC_ALL=C dpkg-scanpackages . /dev/null > Packages
          gzip -9n -c Packages > Packages.gz
          LC_ALL=C apt-ftparchive release . > Release

          cp "$GITHUB_WORKSPACE/build/signing/rafcodephi-archive-key.gpg" .
          cp "$GITHUB_WORKSPACE/build/signing/rafcodephi-archive-key.asc" .

          gpg --batch --yes --local-user "$RAFCODEPHI_APT_SIGNING_FINGERPRINT" \
            --clearsign --output InRelease Release
          gpg --batch --yes --local-user "$RAFCODEPHI_APT_SIGNING_FINGERPRINT" \
            --detach-sign --output Release.gpg Release
          gpg --batch --verify Release.gpg Release
          gpg --batch --verify InRelease

          printf '%s\n' \
            'schema=rafcodephi.signed-apt-repository/v1' \
            'package_name=com.termux.rafacodephi' \
            'prefix=/data/data/com.termux.rafacodephi/files/usr' \
            'architecture=arm' \
            "source_commit=${GITHUB_SHA}" \
            "publish_branch=${RAFCODEPHI_APT_PUBLISH_BRANCH}" \
            "repository_url=${RAFCODEPHI_APT_REPOSITORY_URL}" \
            'trust=SIGNED_BY_ARCHIVE_KEY' \
            "signing_mode=${RAFCODEPHI_APT_SIGNING_MODE}" \
            "signing_fingerprint=${RAFCODEPHI_APT_SIGNING_FINGERPRINT}" \
            'claim_allowed_release=false' > RAFCODEPHI_REPOSITORY_MANIFEST.txt

          sha256sum ./*.deb Packages Packages.gz Release InRelease Release.gpg \
            rafcodephi-archive-key.gpg rafcodephi-archive-key.asc \
            RAFCODEPHI_REPOSITORY_MANIFEST.txt \
            | LC_ALL=C sort -k2 > SHA256SUMS

          grep -q '^Package: ' Packages
          grep -q '^Architecture: arm$' Packages
          sha256sum -c SHA256SUMS

      - name: Resolve signed repository through isolated APT
        shell: bash
        run: |
          set -euo pipefail
          repo=/tmp/rafcodephi-apt-publish/repo
          apt_root=/tmp/rafcodephi-apt-client
          mkdir -p build/reports "$apt_root/etc/apt/sourceparts" "$apt_root/lists/partial" \
            "$apt_root/cache/archives/partial" "$apt_root/var/lib/dpkg"
          : > "$apt_root/var/lib/dpkg/status"

          package_name="$(awk -F ': ' '$1 == "Package" { print $2; exit }' "$repo/Packages")"
          test -n "$package_name"

          printf 'deb [signed-by=%s/rafcodephi-archive-key.gpg] file:%s ./\n' \
            "$repo" "$repo" > "$apt_root/etc/apt/sources.list"

          apt_options=(
            -o "Dir::Etc::sourcelist=$apt_root/etc/apt/sources.list"
            -o "Dir::Etc::sourceparts=$apt_root/etc/apt/sourceparts"
            -o "Dir::State::status=$apt_root/var/lib/dpkg/status"
            -o "Dir::State::lists=$apt_root/lists"
            -o "Dir::Cache::archives=$apt_root/cache/archives"
            -o 'APT::Architecture=arm'
            -o 'APT::Architectures=arm'
            -o 'Acquire::Languages=none'
          )

          set +e
          (
            apt-get "${apt_options[@]}" update
            apt-cache "${apt_options[@]}" show "$package_name"
            apt-get "${apt_options[@]}" -y --download-only --no-install-recommends install "$package_name"
            resolved_filename="$(awk -F ': ' -v pkg="$package_name" '
              $1 == "Package" { current=$2 }
              current == pkg && $1 == "Filename" { print $2; exit }
            ' "$repo/Packages")"
            [[ "$resolved_filename" == ./* ]]
            resolved_deb="$repo/${resolved_filename#./}"
            test -s "$resolved_deb"
            dpkg-deb -f "$resolved_deb" Package | grep -Fx "$package_name"
            sha256sum "$resolved_deb" > build/reports/rafcodephi-isolated-apt-resolved-deb.sha256
          ) 2>&1 | tee build/reports/rafcodephi-isolated-apt.log
          apt_status="${PIPESTATUS[0]}"
          set -e

          python3 - "$apt_status" "$package_name" > build/reports/rafcodephi-isolated-apt-status.json <<'PY'
          import json
          import sys
          status = int(sys.argv[1])
          print(json.dumps({
              "schema": "rafcodephi.isolated-signed-apt-resolution/v1",
              "state": "PASS" if status == 0 else "BLOCKED",
              "exit_code": status,
              "package": sys.argv[2],
              "architecture": "arm",
              "trust": "SIGNED_BY_ARCHIVE_KEY",
              "claim_allowed_release": False,
              "device_runtime_proof": "TOKEN_VAZIO",
          }, sort_keys=True))
          PY

          if [[ "$apt_status" -ne 0 ]]; then
            echo "RAFCODEPHI_ISOLATED_APT=BLOCKED exit_code=$apt_status" >&2
            exit "$apt_status"
          fi
          echo "RAFCODEPHI_ISOLATED_APT=PASS package=$package_name architecture=arm trust=signed-by"

      - name: Bundle portable signed APT repository evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports
          repo=/tmp/rafcodephi-apt-publish/repo
          bundle=build/reports/rafcodephi-arm32-signed-apt-repository.tar
          state=build/reports/rafcodephi-arm32-signed-apt-repository.state
          rm -f "$bundle" "$bundle.sha256"

          if [[ -d "$repo" ]] && compgen -G "$repo/*.deb" >/dev/null; then
            tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner \
              -cf "$bundle" -C "$(dirname "$repo")" "$(basename "$repo")"
            sha256sum "$bundle" > "$bundle.sha256"
            printf '%s\n' \
              'schema=rafcodephi.portable-signed-apt-repository-evidence/v1' \
              'state=PASS' \
              "archive=$bundle" \
              "signing_mode=${RAFCODEPHI_APT_SIGNING_MODE}" \
              "signing_fingerprint=${RAFCODEPHI_APT_SIGNING_FINGERPRINT}" \
              'claim_allowed_release=false' \
              'device_runtime_proof=TOKEN_VAZIO' > "$state"
          else
            printf '%s\n' \
              'schema=rafcodephi.portable-signed-apt-repository-evidence/v1' \
              'state=TOKEN_VAZIO' \
              'reason=APT_REPOSITORY_NOT_MATERIALIZED' \
              'claim_allowed_release=false' \
              'device_runtime_proof=TOKEN_VAZIO' > "$state"
          fi

      - name: Upload bootstrap + signed repository evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rafcodephi-arm32-signed-apt-${{ github.sha }}
          if-no-files-found: warn
          path: |
            build/reports/rafcodephi-arm32-signed-apt-repository.tar
            build/reports/rafcodephi-arm32-signed-apt-repository.tar.sha256
            build/reports/rafcodephi-arm32-signed-apt-repository.state
            build/reports/rafcodephi-isolated-apt.log
            build/reports/rafcodephi-isolated-apt-status.json
            artifacts/rafcodephi-bootstrap/rafcodephi-bootstrap-arm.zip
            artifacts/rafcodephi-bootstrap/RAFCODEPHI_REAL_BOOTSTRAP_MANIFEST.txt

      - name: Publish signed repository branch
        if: github.event_name == 'workflow_dispatch' && inputs.publish == true
        shell: bash
        env:
          APT_PUBLISH_TOKEN: ${{ secrets.RAFCODEPHI_APT_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail

          [[ "$GITHUB_REF_NAME" == "main" ]] || {
            echo "BLOCKED: production publication must be dispatched from main" >&2
            exit 2
          }
          [[ "$RAFCODEPHI_APT_SIGNING_MODE" == "production" ]] || {
            echo "BLOCKED: publication requires production signing identity" >&2
            exit 2
          }
          [[ -n "${APT_PUBLISH_TOKEN:-}" ]] || {
            echo "TOKEN_VAZIO: RAFCODEPHI_APT_PUBLISH_TOKEN not bound" >&2
            exit 2
          }

          publish_dir="$RUNNER_TEMP/rafcodephi-apt-git"
          rm -rf "$publish_dir"
          mkdir -p "$publish_dir"
          git -C "$publish_dir" init -q
          git -C "$publish_dir" config user.name 'RAFCODEPHI CI'
          git -C "$publish_dir" config user.email 'actions@users.noreply.github.com'
          git -C "$publish_dir" remote add origin \
            "https://x-access-token:${APT_PUBLISH_TOKEN}@github.com/rafaelmeloreisnovo/termux-packages.git"

          if git -C "$publish_dir" ls-remote --exit-code --heads origin "$RAFCODEPHI_APT_PUBLISH_BRANCH" >/dev/null 2>&1; then
            git -C "$publish_dir" fetch --depth=1 origin "$RAFCODEPHI_APT_PUBLISH_BRANCH"
            git -C "$publish_dir" checkout -q -B "$RAFCODEPHI_APT_PUBLISH_BRANCH" FETCH_HEAD
          else
            git -C "$publish_dir" checkout -q --orphan "$RAFCODEPHI_APT_PUBLISH_BRANCH"
          fi

          rm -rf "$publish_dir/repo" "$publish_dir/README.md"
          mkdir -p "$publish_dir/repo"
          cp -a /tmp/rafcodephi-apt-publish/repo/. "$publish_dir/repo/"

          printf '%s\n' '# RAFCODEPHI signed APT repository' '' \
            'Custom-prefix ARM32 packages for com.termux.rafacodephi.' '' \
            "Signing fingerprint: ${RAFCODEPHI_APT_SIGNING_FINGERPRINT}" \
            "Source commit: ${GITHUB_SHA}" > "$publish_dir/README.md"

          git -C "$publish_dir" add README.md repo
          if git -C "$publish_dir" diff --cached --quiet; then
            echo "RAFCODEPHI_APT_PUBLISH=NO_CHANGE"
            exit 0
          fi

          git -C "$publish_dir" commit -m "repo: publish signed RAFCODEPHI ARM32 packages from ${GITHUB_SHA}"
          git -C "$publish_dir" push origin "HEAD:${RAFCODEPHI_APT_PUBLISH_BRANCH}"
          echo "RAFCODEPHI_APT_PUBLISH=PASS branch=${RAFCODEPHI_APT_PUBLISH_BRANCH}"
