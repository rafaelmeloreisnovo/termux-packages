name: RAFCODEPHI Real Bootstrap Source Build

on:
  workflow_dispatch:
    inputs:
      architectures:
        description: Architectures to source-build
        required: true
        default: arm
        type: choice
        options:
          - arm
          - aarch64
          - arm,aarch64
  pull_request:
    branches: [main]
    paths:
      - 'scripts/build-rafcodephi-real-bootstrap.sh'
      - 'scripts/generate-bootstraps.sh'
      - 'scripts/properties.sh'
      - 'packages/**'
      - '.github/workflows/rafcodephi-real-bootstrap.yml'

concurrency:
  group: rafcodephi-real-bootstrap-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  real-bootstrap-arm:
    name: Source-build real RAFCODEPHI bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CI: 'true'
      TERMUX_DOCKER_USE_SUDO: '1'
      RAFCODEPHI_PACKAGE_NAME: com.termux.rafacodephi

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select architecture set
        id: arch
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            ARCHITECTURES='${{ inputs.architectures }}'
          else
            ARCHITECTURES='arm'
          fi
          echo "architectures=$ARCHITECTURES" >> "$GITHUB_OUTPUT"
          echo "Selected: $ARCHITECTURES"

      - name: Validate no bridge-only success path
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'generate-bootstraps.sh' scripts/build-rafcodephi-real-bootstrap.sh
          grep -q -- '--build' scripts/build-rafcodephi-real-bootstrap.sh
          grep -q 'bridge_allowed=false' scripts/build-rafcodephi-real-bootstrap.sh
          grep -q 'legacy_prefix_allowed=false' scripts/build-rafcodephi-real-bootstrap.sh
          grep -q "RAFCODEPHI pkg bridge" scripts/build-rafcodephi-real-bootstrap.sh
          grep -q "is a bridge, not a real package-manager frontend" scripts/build-rafcodephi-real-bootstrap.sh

      - name: Build source packages and real bootstrap in Termux builder
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/build-rafcodephi-real-bootstrap.sh scripts/run-docker.sh
          ./scripts/run-docker.sh \
            ./scripts/build-rafcodephi-real-bootstrap.sh \
            --architectures '${{ steps.arch.outputs.architectures }}'

      - name: Verify manifest is fail-closed
        shell: bash
        run: |
          set -euo pipefail
          manifest=artifacts/rafcodephi-bootstrap/RAFCODEPHI_REAL_BOOTSTRAP_MANIFEST.txt
          test -s "$manifest"
          grep -Fx 'schema=rafcodephi.real-bootstrap-sourcebuild/v1' "$manifest"
          grep -Fx 'package_name=com.termux.rafacodephi' "$manifest"
          grep -Fx 'prefix=/data/data/com.termux.rafacodephi/files/usr' "$manifest"
          grep -Fx 'bridge_allowed=false' "$manifest"
          grep -Fx 'legacy_prefix_allowed=false' "$manifest"
          grep -Fx 'claim_allowed_device_runtime=false' "$manifest"
          grep -Fx 'device_runtime_proof=TOKEN_VAZIO' "$manifest"
          cat "$manifest"

      - name: Upload real bootstrap artifacts
        uses: actions/upload-artifact@v7
        with:
          name: rafcodephi-real-bootstrap-${{ steps.arch.outputs.architectures }}-${{ github.sha }}
          path: artifacts/rafcodephi-bootstrap/
          if-no-files-found: error
          retention-days: 30
