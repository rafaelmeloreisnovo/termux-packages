name: RAFCODEPHI RMR Package Build

on:
  pull_request:
    paths:
      - 'packages/rafcodephi-rmr-vector-field/**'
      - 'docs/assurance/rafcodephi-freestanding-modules.v1.json'
      - 'scripts/validate_rafcodephi_freestanding_module.py'
      - '.github/workflows/rafcodephi-rmr-package-build.yml'
  push:
    branches:
      - main
    paths:
      - 'packages/rafcodephi-rmr-vector-field/**'
      - 'docs/assurance/rafcodephi-freestanding-modules.v1.json'
      - 'scripts/validate_rafcodephi_freestanding_module.py'
      - '.github/workflows/rafcodephi-rmr-package-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        arch: [arm, aarch64]
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v6

      - name: Validate source custody
        run: python3 scripts/validate_rafcodephi_freestanding_module.py

      - name: Configure RAFCODEPHI package prefix
        run: bash scripts/rafcodephi-configure-package-name.sh

      - name: Build source package without official-binary mixing
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          ./scripts/run-docker.sh ./build-package.sh -C -a "$ARCH" rafcodephi-rmr-vector-field

      - name: Verify base and static deb payloads
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p out/rmr-package

          mapfile -t mains < <(find output -maxdepth 1 -type f -name 'rafcodephi-rmr-vector-field_*.deb' -print | sort)
          mapfile -t statics < <(find output -maxdepth 1 -type f -name 'rafcodephi-rmr-vector-field-static_*.deb' -print | sort)
          if [[ ${#mains[@]} -ne 1 || ${#statics[@]} -ne 1 ]]; then
            printf 'expected one base and one static RMR deb; base=%d static=%d\n' "${#mains[@]}" "${#statics[@]}" >&2
            find output -maxdepth 1 -type f -name 'rafcodephi-rmr-vector-field*.deb' -print >&2 || true
            exit 68
          fi

          main_deb="${mains[0]}"
          static_deb="${statics[0]}"
          [[ "$(dpkg-deb -f "$main_deb" Package)" == 'rafcodephi-rmr-vector-field' ]]
          [[ "$(dpkg-deb -f "$static_deb" Package)" == 'rafcodephi-rmr-vector-field-static' ]]

          sha256sum "$main_deb" "$static_deb" | tee out/rmr-package/SHA256SUMS.txt
          dpkg-deb -c "$main_deb" | tee out/rmr-package/base-payload.txt
          dpkg-deb -c "$static_deb" | tee out/rmr-package/static-payload.txt

          grep -q 'include/rafcodephi/rmr/rmr_vector_field.h' out/rmr-package/base-payload.txt
          grep -q 'include/rafcodephi/rmr/rmr_types.h' out/rmr-package/base-payload.txt
          grep -q 'share/doc/rafcodephi-rmr-vector-field/ORIGIN.md' out/rmr-package/base-payload.txt
          grep -q 'lib/librafcodephi-rmr-vector-field.a' out/rmr-package/static-payload.txt

          cp "$main_deb" "$static_deb" out/rmr-package/
          {
            echo 'schema=rafcodephi.rmr-package-build-receipt/v1'
            echo "source_commit=${GITHUB_SHA}"
            echo "arch=${ARCH}"
            echo 'package=rafcodephi-rmr-vector-field'
            echo 'static_subpackage=rafcodephi-rmr-vector-field-static'
            echo 'source_origin=rafaelmeloreisnovo/Vectras-VM-Android@34aa3db434627c40cdc6fdb595591634e74d090d'
            echo 'payload_split=BASE_HEADERS_PROVENANCE_PLUS_STATIC_ARCHIVE'
            echo 'claim_allowed=false'
            echo 'physical_runtime=TOKEN_VAZIO'
          } > out/rmr-package/receipt.txt

      - name: Upload package evidence
        uses: actions/upload-artifact@v6
        with:
          name: rafcodephi-rmr-vector-field-${{ matrix.arch }}-${{ github.sha }}
          path: out/rmr-package/
          if-no-files-found: error
