name: RAFCODEPHI RMR Package Build

on:
  pull_request:
    paths:
      - 'packages/rafcodephi-rmr-vector-field/**'
      - 'docs/assurance/rafcodephi-freestanding-modules.v1.json'
      - 'scripts/validate_rafcodephi_freestanding_module.py'
      - '.github/workflows/rafcodephi-rmr-package-build.yml'
  push:
    branches:
      - main
    paths:
      - 'packages/rafcodephi-rmr-vector-field/**'
      - 'docs/assurance/rafcodephi-freestanding-modules.v1.json'
      - 'scripts/validate_rafcodephi_freestanding_module.py'
      - '.github/workflows/rafcodephi-rmr-package-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        arch: [arm, aarch64]
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v6

      - name: Validate source custody
        run: python3 scripts/validate_rafcodephi_freestanding_module.py

      - name: Configure RAFCODEPHI package prefix
        run: bash scripts/rafcodephi-configure-package-name.sh

      - name: Build source package without official-binary mixing
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          ./scripts/run-docker.sh ./build-package.sh -C -a "$ARCH" rafcodephi-rmr-vector-field

      - name: Verify produced deb and installed payload manifest
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p out/rmr-package
          mapfile -t debs < <(find output -maxdepth 1 -type f -name 'rafcodephi-rmr-vector-field_*.deb' -print | sort)
          if [[ ${#debs[@]} -ne 1 ]]; then
            printf 'expected exactly one RMR deb, found %d\n' "${#debs[@]}" >&2
            printf '%s\n' "${debs[@]}" >&2
            exit 68
          fi
          deb="${debs[0]}"
          sha256sum "$deb" | tee out/rmr-package/SHA256SUMS.txt
          dpkg-deb -c "$deb" | tee out/rmr-package/payload.txt
          grep -q 'librafcodephi-rmr-vector-field.a' out/rmr-package/payload.txt
          grep -q 'include/rafcodephi/rmr/rmr_vector_field.h' out/rmr-package/payload.txt
          grep -q 'include/rafcodephi/rmr/rmr_types.h' out/rmr-package/payload.txt
          grep -q 'share/doc/rafcodephi-rmr-vector-field/ORIGIN.md' out/rmr-package/payload.txt
          cp "$deb" out/rmr-package/
          {
            echo 'schema=rafcodephi.rmr-package-build-receipt/v1'
            echo "source_commit=${GITHUB_SHA}"
            echo "arch=${ARCH}"
            echo 'package=rafcodephi-rmr-vector-field'
            echo 'source_origin=rafaelmeloreisnovo/Vectras-VM-Android@34aa3db434627c40cdc6fdb595591634e74d090d'
            echo 'claim_allowed=false'
            echo 'physical_runtime=TOKEN_VAZIO'
          } > out/rmr-package/receipt.txt

      - name: Upload package evidence
        uses: actions/upload-artifact@v6
        with:
          name: rafcodephi-rmr-vector-field-${{ matrix.arch }}-${{ github.sha }}
          path: out/rmr-package/
          if-no-files-found: error
