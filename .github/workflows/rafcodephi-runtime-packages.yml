name: RAFCODEPHI Runtime Packages

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Minimal package profile"
        required: true
        type: choice
        default: runtime
        options:
          - bootstrap
          - runtime
          - vectras
          - full
      target_arch:
        description: "Target ABI lane"
        required: true
        type: choice
        default: arm
        options:
          - arm
          - aarch64
  push:
    branches:
      - run/rafcodephi-runtime-arm-20260909

permissions:
  contents: read

concurrency:
  group: rafcodephi-runtime-${{ github.ref }}
  cancel-in-progress: false

env:
  RAFCODEPHI_PROFILE: ${{ github.event_name == 'workflow_dispatch' && inputs.profile || 'runtime' }}
  RAFCODEPHI_ARCH: ${{ github.event_name == 'workflow_dispatch' && inputs.target_arch || 'arm' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout pinned source tree
        uses: actions/checkout@v6

      - name: Configure custom Termux package identity
        run: bash scripts/rafcodephi-configure-package-name.sh

      - name: Resolve minimal profile
        id: profile
        env:
          PROFILE: ${{ env.RAFCODEPHI_PROFILE }}
        run: |
          set -euo pipefail
          # Output package names and source recipe names are kept separate.
          # RAFCODEPHI metapackages make the profile dependency graph installable
          # while third-party source remains in its original package recipes.
          bootstrap_outputs=(apt bash busybox dpkg ca-certificates coreutils termux-tools rafcodephi-federation-metadata rafcodephi-bootstrap-profile)
          bootstrap_recipes=(apt bash busybox dpkg ca-certificates coreutils termux-tools rafcodephi-federation-metadata rafcodephi-bootstrap-profile)
          runtime_outputs=(openssl curl git python procps b3sum rafcodephi-runtime-profile)
          runtime_recipes=(openssl libcurl git python procps b3sum rafcodephi-runtime-profile)
          vectras_outputs=(proot rafcodephi-vectras-profile)
          vectras_recipes=(proot rafcodephi-vectras-profile)
          api_outputs=(termux-api rafcodephi-full-profile)
          api_recipes=(termux-api rafcodephi-full-profile)

          required=("${bootstrap_outputs[@]}")
          recipes=("${bootstrap_recipes[@]}")
          case "$PROFILE" in
            bootstrap) ;;
            runtime)
              required+=("${runtime_outputs[@]}")
              recipes+=("${runtime_recipes[@]}")
              ;;
            vectras)
              required+=("${runtime_outputs[@]}" "${vectras_outputs[@]}")
              recipes+=("${runtime_recipes[@]}" "${vectras_recipes[@]}")
              ;;
            full)
              required+=("${runtime_outputs[@]}" "${vectras_outputs[@]}" "${api_outputs[@]}")
              recipes+=("${runtime_recipes[@]}" "${vectras_recipes[@]}" "${api_recipes[@]}")
              ;;
            *) echo "unknown profile: $PROFILE" >&2; exit 64 ;;
          esac

          printf '%s\n' "${required[@]}" | tee rafcodephi-required-packages.txt
          printf '%s\n' "${recipes[@]}" | tee rafcodephi-source-recipes.txt
          paste rafcodephi-required-packages.txt rafcodephi-source-recipes.txt > rafcodephi-package-source-map.tsv
          printf 'recipes=%s\n' "${recipes[*]}" >> "$GITHUB_OUTPUT"

      - name: Capture recipe provenance and license metadata
        run: |
          set -euo pipefail
          : > rafcodephi-recipe-sha256.txt
          : > rafcodephi-license-metadata.tsv
          while IFS=$'\t' read -r output_pkg recipe_pkg; do
            recipe="packages/${recipe_pkg}/build.sh"
            if [[ ! -f "$recipe" ]]; then
              printf 'missing recipe: output=%s source=%s path=%s\n' "$output_pkg" "$recipe_pkg" "$recipe" >&2
              exit 65
            fi
            sha256sum "$recipe" >> rafcodephi-recipe-sha256.txt
            license="$(grep -m1 '^TERMUX_PKG_LICENSE=' "$recipe" || true)"
            homepage="$(grep -m1 '^TERMUX_PKG_HOMEPAGE=' "$recipe" || true)"
            printf '%s\t%s\t%s\t%s\n' "$output_pkg" "$recipe_pkg" "$license" "$homepage" >> rafcodephi-license-metadata.tsv
          done < rafcodephi-package-source-map.tsv

      - name: Validate federated attribution before package build
        run: python3 scripts/validate_rafcodephi_federated_provenance.py

      - name: Build only selected RAFCODEPHI packages and dependency closure
        env:
          ARCH: ${{ env.RAFCODEPHI_ARCH }}
          RECIPES: ${{ steps.profile.outputs.recipes }}
        run: |
          set -euo pipefail
          # Do not use -I: official Termux binary dependencies target com.termux
          # and must not be mixed with com.termux.rafacodephi packages.
          read -r -a recipe_array <<< "$RECIPES"
          ./scripts/run-docker.sh ./build-package.sh -C -a "$ARCH" "${recipe_array[@]}"

      - name: Produce content-addressed receipt
        if: always()
        env:
          ARCH: ${{ env.RAFCODEPHI_ARCH }}
          PROFILE: ${{ env.RAFCODEPHI_PROFILE }}
        run: |
          set -euo pipefail
          mkdir -p rafcodephi-artifacts
          if compgen -G 'output/*.deb' > /dev/null; then
            cp output/*.deb rafcodephi-artifacts/
          fi
          find rafcodephi-artifacts -type f -name '*.deb' -print0 \
            | sort -z \
            | xargs -0r sha256sum > rafcodephi-debs.sha256
          {
            echo "schema=rafcodephi.package-build-receipt/v1"
            echo "source_commit=${GITHUB_SHA}"
            echo "app_package=com.termux.rafacodephi"
            echo "target_arch=${ARCH}"
            echo "profile=${PROFILE}"
            echo "claim_allowed=false"
            echo "packages=$(tr '\n' ' ' < rafcodephi-required-packages.txt)"
            echo "source_recipes=$(tr '\n' ' ' < rafcodephi-source-recipes.txt)"
          } > rafcodephi-package-build.receipt
          cp rafcodephi-required-packages.txt rafcodephi-source-recipes.txt \
             rafcodephi-package-source-map.tsv rafcodephi-recipe-sha256.txt \
             rafcodephi-license-metadata.tsv rafcodephi-debs.sha256 \
             rafcodephi-package-build.receipt rafcodephi-artifacts/

      - name: Upload immutable build evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rafcodephi-${{ env.RAFCODEPHI_PROFILE }}-${{ env.RAFCODEPHI_ARCH }}-${{ github.sha }}
          path: rafcodephi-artifacts/
          if-no-files-found: error
