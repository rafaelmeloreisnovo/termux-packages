name: Build and publish RAFCODEPHI developer APT snapshot

on:
  push:
    branches: [fix/recover-real-pkg-handoff-20261109]
    paths:
      - .github/workflows/recovered-preview-apt.yml
      - packages/rafcodephi-developer-profile/**
      - packages/openjdk-21/**
      - scripts/build-rafcodephi-developer-packages.sh
      - scripts/verify_rafcodephi_developer_debs.py
      - scripts/prepare_recovered_apt.py
      - scripts/test_recovered_apt_resolution.py
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: recovered-developer-apt-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-developer-packages:
    name: Source-build developer profile (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      CI: 'true'
      TERMUX_DOCKER_USE_SUDO: '1'
      TERMUX_BUILDER_IMAGE_NAME: ghcr.io/termux-play-store/package-builder@sha256:09cdbb34db05274dfcdf0e52430de2980e3e58aa34fa122a05c014bf67e24124
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm
            artifact_id: '13691792986'
            artifact_sha256: '3d44df5dcd20c539140f1c3867f41e1b3311f009ff80d24c5a4e65fbcdb35953'
          - arch: aarch64
            artifact_id: '13692117243'
            artifact_sha256: 'e6da0da42ba0d51b12c932f4d41985433a9396414952b6cddc23948e53e44804'
    steps:
      - name: Checkout exact developer source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Validate developer source contracts
        shell: bash
        run: |
          set -euo pipefail
          bash -n packages/rafcodephi-developer-profile/build.sh
          bash -n scripts/build-rafcodephi-developer-packages.sh
          python3 scripts/verify_rafcodephi_developer_debs.py --self-test
          python3 scripts/validate_rafcodephi_federated_provenance.py

      - name: Recover immutable base package set
        env:
          GH_TOKEN: ${{ github.token }}
          ARCH: ${{ matrix.arch }}
          ARTIFACT_ID: ${{ matrix.artifact_id }}
          ARTIFACT_SHA256: ${{ matrix.artifact_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "inputs/$ARCH"
          gh api "repos/rafaelmeloreisnovo/termux-packages/actions/artifacts/$ARTIFACT_ID/zip" > "inputs/$ARCH.zip"
          printf '%s  %s\n' "$ARTIFACT_SHA256" "inputs/$ARCH.zip" | sha256sum -c -
          python3 - "$ARCH" <<'PY'
          import io, pathlib, sys, tarfile, zipfile
          arch=sys.argv[1]
          root=pathlib.Path('inputs')/arch
          with zipfile.ZipFile('inputs/'+arch+'.zip') as archive:
              (root/'receipt.json').write_bytes(archive.read('receipt.json'))
              with tarfile.open(fileobj=io.BytesIO(archive.read('debs.tar.gz')), mode='r:gz') as transport:
                  for member in transport:
                      path=pathlib.PurePosixPath(member.name)
                      if path.is_absolute() or '..' in path.parts or '\\' in member.name:
                          raise ValueError('unsafe path')
                      if member.isdir():
                          continue
                      if not member.isfile() or len(path.parts)!=2 or path.parts[0]!='debs':
                          raise ValueError('unsafe member')
                      target=root/str(path)
                      target.parent.mkdir(exist_ok=True)
                      target.write_bytes(transport.extractfile(member).read())
          PY
          # The canonical builder runs as its unprivileged builder UID while
          # this checkout is bind-mounted from the host runner.  It must be
          # able to replace recovered DEBs when rebuilding the same recipe.
          chmod -R a+rwX "inputs/$ARCH"
          rm "inputs/$ARCH.zip"

      - name: Materialize custom Termux package identity
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply-rafcodephi-build-properties.py \
            --properties scripts/properties.sh \
            --receipt "inputs/${{ matrix.arch }}/rafcodephi-build-properties.json"
          bash scripts/validate-rafcodephi-build-properties.sh

      - name: Provision SHA-bound NDK29 in canonical builder
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/run-docker.sh bash scripts/ci/rafcodephi_prepare_ndk29.sh

      - name: Source-build Node JDK fastboot clang and NDK sysroot
        shell: bash
        run: |
          set -euo pipefail
          arch="${{ matrix.arch }}"
          export RAFCODEPHI_BOOTSTRAP_HOST_OUT_DIR="$PWD/artifacts/developer-$arch"
          bash scripts/run-rafcodephi-bootstrap-docker.sh env \
            ARCH="$arch" NDK=/home/builder/.termux-build/android-ndk-r29 \
            bash -c '
              set -euo pipefail
              work="$RAFCODEPHI_BOOTSTRAP_OUT_DIR/inputs"
              mkdir -p "$work"
              cp -a "inputs/$ARCH" "$work/$ARCH"
              chmod -R u+rwX "$work/$ARCH"
              bash ./scripts/build-rafcodephi-developer-packages.sh \
                --architectures "$ARCH" --deb-root "$work"
              printf "%s\n" \
                "schema=rafcodephi.developer-container-handoff/v1" \
                "architecture=$ARCH" \
                "source_commit=${GITHUB_SHA:-TOKEN_VAZIO}" \
                > "$RAFCODEPHI_BOOTSTRAP_OUT_DIR/RAFCODEPHI_REAL_BOOTSTRAP_MANIFEST.txt"
            '
          python3 - "$arch" "$RAFCODEPHI_BOOTSTRAP_HOST_OUT_DIR" <<'PY'
          import pathlib, shutil, sys
          arch, out = sys.argv[1:]
          source = pathlib.Path(out) / 'inputs' / arch
          target = pathlib.Path('inputs') / arch
          if not (source / 'rafcodephi-developer-static-gate.json').is_file():
              raise SystemExit('developer container handoff is incomplete')
          shutil.rmtree(target)
          shutil.copytree(source, target)
          PY

      - name: Seal portable package handoff
        shell: bash
        run: |
          set -euo pipefail
          arch="${{ matrix.arch }}"
          mkdir -p "handoff/$arch"
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner \
            -cf "handoff/$arch/debs.tar" -C "inputs/$arch" debs
          cp "inputs/$arch/receipt.json" \
             "inputs/$arch/rafcodephi-developer-static-gate.json" \
             "handoff/$arch/"
          (cd "handoff/$arch" && sha256sum debs.tar > debs.tar.sha256)
          (cd "handoff/$arch" && sha256sum -c debs.tar.sha256)

      - name: Upload extended architecture handoff
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: rafcodephi-developer-${{ matrix.arch }}-${{ github.sha }}
          path: handoff/
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  signed-snapshot:
    name: Signed immutable developer repository
    needs: build-developer-packages
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout exact publisher source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Download both verified architecture handoffs
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
        with:
          pattern: rafcodephi-developer-*-${{ github.sha }}
          path: inputs
          merge-multiple: true

      - name: Restore exact DEB basenames from TAR transport
        shell: bash
        run: |
          set -euo pipefail
          for arch in arm aarch64; do
            test -s "inputs/$arch/debs.tar"
            (cd "inputs/$arch" && sha256sum -c debs.tar.sha256)
            mkdir -p "inputs/$arch/debs"
            tar -xf "inputs/$arch/debs.tar" -C "inputs/$arch" \
              --no-same-owner --no-same-permissions
            test -s "inputs/$arch/receipt.json"
            test -s "inputs/$arch/rafcodephi-developer-static-gate.json"
          done

      - name: Build signed development snapshot from verified package bytes
        shell: bash
        run: |
          set -euo pipefail
          branch="rafcodephi-apt-preview-${GITHUB_RUN_ID}"
          url="https://raw.githubusercontent.com/rafaelmeloreisnovo/termux-packages/$branch/repo"
          echo "SNAPSHOT_BRANCH=$branch" >> "$GITHUB_ENV"
          echo "SNAPSHOT_URL=$url" >> "$GITHUB_ENV"
          python3 scripts/prepare_recovered_apt.py \
            --source inputs --output publish/repo \
            --signing "$RUNNER_TEMP/snapshot-signing" --url "$url"

      - name: Verify signed install resolution for full developer profile
        run: python3 scripts/test_recovered_apt_resolution.py --base checks --repo publish/repo

      - name: Publish immutable successor snapshot after package gates
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = fix/recover-real-pkg-handoff-20261109
          gh auth setup-git
          git -C publish init -b "$SNAPSHOT_BRANCH"
          git -C publish config user.name 'RAFCODEPHI CI'
          git -C publish config user.email 'actions@users.noreply.github.com'
          git -C publish remote add origin https://github.com/rafaelmeloreisnovo/termux-packages.git
          if git -C publish ls-remote --exit-code --heads origin "$SNAPSHOT_BRANCH"; then
            echo 'BLOCKED: immutable development snapshot branch already exists' >&2
            exit 2
          fi
          printf '%s\n' '# RAFCODEPHI developer APT snapshot' '' \
            'Real custom-prefix ARM32/ARM64 packages with Node.js, JDK, adb/fastboot, clang, Ninja and the Termux NDK sysroot.' \
            'Install with: pkg install rafcodephi-developer-profile' '' \
            'Development signing identity; physical Android runtime remains TOKEN_VAZIO.' > publish/README.md
          git -C publish add README.md repo
          git -C publish commit -m 'Publish immutable RAFCODEPHI developer APT snapshot'
          git -C publish push origin "HEAD:refs/heads/$SNAPSHOT_BRANCH"

      - name: Verify published HTTPS APT profile download
        run: python3 scripts/test_recovered_apt_resolution.py --base https-checks --repo publish/repo --url "$SNAPSHOT_URL"

      - name: Upload trust anchor and host APT receipts
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: recovered-developer-signed-apt-${{ github.sha }}
          path: |
            publish/repo/snapshot.json
            publish/repo/rafcodephi-archive-key.gpg
            publish/repo/dists/stable/Release
            publish/repo/dists/stable/InRelease
            inputs/*/rafcodephi-developer-static-gate.json
            checks/*.json
            checks/*.log
            https-checks/*.json
            https-checks/*.log
          if-no-files-found: warn
          retention-days: 30
